{% assign pub = site.data.publications | where: 'id', page.slug | first %}
{% assign paper_url = pub.paper_url | default: page.paperlink %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="0;url={{ paper_url | escape }}">
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="{{ paper_url | escape }}">
  <title>{{ pub.title | default: page.title | escape }} · WAISL</title>
</head>
<body>
  <p><a href="{{ paper_url | escape }}">Read the paper.</a></p>
</body>
</html>
