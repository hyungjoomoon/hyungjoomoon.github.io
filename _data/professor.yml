biography: I lead the Wireless AI Systems Lab at DGIST. I received my PhD from Yonsei University in 2026 under the supervision of Prof. Chan-Byoung Chae. My research combines wireless communications, machine learning, and real-world prototyping, with a focus on AI-native wireless systems, latent communications for edge intelligence, and wireless sensing and digital twins.
